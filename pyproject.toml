[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "dotears"
version = "0.1.3"
description = "Give Your AI Agent Ears — local-first audio perception for video references"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["numpy>=1.26,<3", "librosa>=0.11,<0.12"]

[project.optional-dependencies]
download = ["yt-dlp>=2025.3"]
asr = ["faster-whisper>=1.1,<2"]
yamnet = ["tensorflow>=2.16,<2.22"]
sfx = ["torch>=2.6,<3", "transformers>=4.57.1,<5"]
sfx-presence = ["torch>=2.6,<3", "torchaudio>=2.6,<3", "transformers>=4.57.1,<5", "safetensors>=0.4,<1"]
separation = ["torch>=2.6,<3", "transformers>=4.57.1,<5", "torchlibrosa>=0.1,<0.2"]
mcp = ["mcp>=1.12,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11", "build>=1.2", "jsonschema>=4", "psutil>=6"]

[project.scripts]
dotears = "dotears.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dotears"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/docs", "/examples", "/schemas", "/README.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md", "/pyproject.toml", "/.gitignore", "/requirements-validation.windows-py311.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires local FFmpeg", "model: requires explicitly prepared local weights"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".cache", ".venv", "models", "validation-output", "private-media"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

